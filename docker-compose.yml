services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vibezz
      POSTGRES_PASSWORD: vibezz
      POSTGRES_DB: vibezz_cms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibezz -d vibezz_cms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
